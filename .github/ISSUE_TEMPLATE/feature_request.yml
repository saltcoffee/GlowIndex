name: 功能建议
description: 提议新的能力、数据源、接口或算法改进
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述真实使用场景和当前限制，不要只描述实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、输入输出和用户体验。
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: 边界与替代方案
      description: 哪些内容不在范围内？是否有更简单的替代方案？

  - type: textarea
    id: evidence
    attributes:
      label: 数据与验证方式
      description: 涉及评分或数据源时，请说明样本、许可、成本、降级策略和如何验证。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同建议。
          required: true
        - label: 建议不要求公开密钥、个人信息或无权使用的数据。
          required: true
